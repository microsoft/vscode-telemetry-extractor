version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    groups:
      github-actions:
        patterns: ["*"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "npm"
    directory: "/"
    groups:
      npm-development:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      npm-production:
        dependency-type: "production"
        update-types: ["minor", "patch"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
